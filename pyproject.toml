[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-localization-platform"
version = "0.1.0"
description = "Multimodal AI localization platform (ADK + Gemini) — Phase 1 vertical slice"
requires-python = ">=3.11"
# Ranges, not exact pins: PyPI was unreachable when this was written, so exact compatible
# versions were NOT verified. After first install run `pip freeze` / `uv pip compile` and commit a lock file.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0,<2"]
adk = ["google-adk>=1.0,<2"]
whisper = ["faster-whisper>=1.0,<2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
